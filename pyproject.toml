[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorzip"
version = "0.1.0"
description = "Post-hoc embedding compression and dimensionality reduction for RAG and vector search"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "sergimichi", email = "sergimichi@users.noreply.github.com"}]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
]
keywords = ["embeddings", "rag", "vector-search", "compression", "quantization", "dct", "pca", "matryoshka"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
full = [
    "scikit-learn",
    "sentence-transformers",
]
dev = [
    "pytest",
    "scikit-learn",
    "sentence-transformers",
    "datasets",
]

[project.urls]
Homepage = "https://github.com/sergimichi/vectorzip"
Documentation = "https://sergimichi.github.io/vectorzip/"
Repository = "https://github.com/sergimichi/vectorzip.git"
"Bug Tracker" = "https://github.com/sergimichi/vectorzip/issues"

[tool.setuptools]
packages = ["vectorzip"]
